name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo deploy a la vez; no cancela el que ya está corriendo.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      # basePath: GitHub Pages sirve los project sites bajo /<repo>, así que el
      # export necesita ese prefijo en rutas y assets.
      - name: Build estático
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      # PDF de los apuntes: Chromium headless abre cada /apunte/<id>/ del export
      # y lo imprime a out/apuntes/<id>.pdf. Sólo hace falta el headless shell
      # (no el Chromium completo); se cachea por versión de Playwright.
      - name: Versión de Playwright
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-shell

      - name: Instalar Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Dependencias del sistema para Chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: PDF de los apuntes
        run: npm run pdf
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      # .nojekyll: sin esto Pages ignora los archivos que empiezan con guion
      # bajo, y Next emite justamente _next/.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
