  <title>Condición de Fourier para f(x) = x − cos x en [0, π/2]</title>
  <desc>f'' = cos x ≥ 0 en todo el intervalo, así que f·f'' &gt; 0 donde f &gt; 0: a la derecha de α ≈ 0,7391. Desde x₀ = π/2 Newton baja monótono (0,7854, 0,7395, …). Desde x₀ = 0, donde f·f'' &lt; 0, el primer paso salta al otro lado (x₁ = 1,0000) y recién ahí sigue monótono.</desc>
